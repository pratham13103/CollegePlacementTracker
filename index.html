<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Tracker</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./CSS/header.css">
    <link rel="stylesheet" href="./CSS/index.css">
</head>

<body>
    <header id="header">
        <h1>Placement Tracker</h1>

        <input type="search" id="search" placeholder="Search students, colleges, companies...">

        <nav id="navlinks">
            <a href="./index.html">Home</a>
            <a href="./HTML/students.html">Students</a>
            <a href="./HTML/colleges.html">Colleges</a>
            <a href="./HTML/companies.html">Companies</a>
            <a href="./HTML/roles.html">Job Roles</a>
        </nav>
    </header>

    <main id="main-content">
        <div class="card" id="students" data-count="120">
            <p>Students</p>
        </div>
        <div class="card" id="colleges" data-count="15">
            <p>Colleges</p>
        </div>
        <div class="card" id="companies" data-count="42">
            <p>Companies</p>
        </div>
        <div class="card" id="job-roles" data-count="18">
            <p>Job Roles</p>
        </div>
    </main>

    <!-- JS -->
    <script src="./JS/students.js"></script>
    <script src="./JS/colleges.js"></script>
    <script src="./JS/companies.js"></script>
    <script src="./JS/roles.js"></script>
    <script src="./JS/api.js"></script>
    <script src="./JS/index.js"></script>
</body>

</html>
