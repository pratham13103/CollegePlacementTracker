<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Roles</title>

    <link rel="stylesheet" href="../CSS/header.css">
    <link rel="stylesheet" href="../CSS/index.css">

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background-color: #f4f6fb;
            color: #111827;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        #roles-controls {
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            background-color: #f4f6fb;
        }

        #roles-controls button {
            padding: 10px 18px;
            font-size: 15px;
            border-radius: 999px;
            cursor: pointer;
            color: white;
            border: none;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #roles-controls button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(99, 102, 241, 0.45);
        }

        #roles-container {
            width: 100%;
            min-height: calc(100vh - 160px);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            padding-bottom: 40px;
            background-color: #f4f6fb;
        }

        .role-card {
            height: 200px;
            width: 300px;
            background: white;
            border: 1px solid black;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .role-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.18);
        }

        .role-card h3,
        .role-card h4,
        .role-card p {
            margin: 6px 0;
            color: #1f2933;
        }

        #header {
            background-color: rgb(115, 115, 115);
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 0;
        }

        #header h1 {
            color: white;
        }

        #navlinks a {
            color: white;
            font-weight: 500;
        }

        #navlinks a:hover {
            color: #4f46e5;
        }

        .form-title {
            grid-column: 1 / -1;
            /* span full width */
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 10px;
        }

        #search {
            border: 1.5px solid #d1d5db;
            border-radius: 999px;
            padding: 10px 18px;
            background-color: #ffffff;
        }

        #search:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
    </style>

</head>

<body>
    <header id="header">
        <h1>Placement Tracker</h1>
        <input type="search" id="search" placeholder="Search roles...">
        <nav id="navlinks">
            <a href="../index.html">Home</a>
            <a href="./students.html">Students</a>
            <a href="./colleges.html">Colleges</a>
            <a href="./companies.html">Companies</a>
            <a href="./roles.html">Job Roles</a>
        </nav>
    </header>

    <section id="roles-controls">
        <button id="add-role">Add New Job Role</button>
    </section>
    <section id="roles-container"></section>

    <script src="../JS/api.js"></script>
    <script src="../JS/roles.js"></script>
</body>

</html>
