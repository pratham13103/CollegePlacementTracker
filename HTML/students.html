<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>

    <link rel="stylesheet" href="../CSS/header.css">
    <link rel="stylesheet" href="../CSS/index.css">

    <style>
        body {
            margin: 0;
            background-color: #f4f6fb;
            color: #111827;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        #students-controls {
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            background-color: #f4f6fb;
        }

        #students-controls button {
            padding: 10px 18px;
            font-size: 15px;
            border-radius: 999px;
            cursor: pointer;
            color: white;
            border: none;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #students-controls button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(99, 102, 241, 0.45);
        }

        #students-container {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            padding-bottom: 40px;
            background-color: #f4f6fb;
        }

        #student-card {
            height: 330px;
            width: 300px;
            background: white;
            border-radius: 14px;
            border: 1px solid black;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #student-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.18);
        }

        #student-card img {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e0e7ff;
        }

        #student-card h4,
        #student-card h5 {
            margin: 4px 0;
            color: #1f2933;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .card-actions button {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .edit-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .edit-btn:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
        }

        .delete-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .delete-btn:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
        }

        #header {
            background-color: rgb(115, 115, 115);
            border-bottom: 1px solid #e5e7eb;
        }

        #header h1 {
            color: white;
        }

        #navlinks a {
            color:white;
            font-weight: 500;
        }

        #navlinks a:hover {
            color: #4f46e5;
        }

        #search {
            background-color: #f9fafb;
            border: 1px solid #111827;
            color: #111827;
        }
    </style>

</head>

<body>
    <header id="header">
        <h1>Placement Tracker</h1>
        <input type="search" id="search" placeholder="Search students, colleges, companies...">
        <nav id="navlinks">
            <a href="./index.html">Home</a>
            <a href="./students.html">Students</a>
            <a href="./colleges.html">Colleges</a>
            <a href="./companies.html">Companies</a>
            <a href="./roles.html">Job Roles</a>
        </nav>
    </header>
    <section id="students-controls">
        <button id="add-student">Add New Student</button>
        <button id="placed">Placed Students</button>
        <button id="not-placed">Not Placed Students</button>
    </section>
    <section id="students-container"></section>
    <script src="../JS/api.js"></script>
    <script src="../JS/students.js"></script>
</body>

</html>
