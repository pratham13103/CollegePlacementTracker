<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/header.css">
    <link rel="stylesheet" href="../CSS/index.css">

    <style>
        body {
            background-color: #f4f6fb;
        }

        #roleForm {
            max-width: 720px;
            margin: 40px auto;
            padding: 32px;
            background: white;
            border-radius: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }

        #roleForm input,
        #roleForm select {
            height: 42px;
            width: 100%;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 15px;
            outline: none;
            background-color: #fafafa;
        }

        #roleForm input:focus,
        #roleForm select:focus {
            border-color: #6366f1;
            background-color: white;
        }

        #roleForm button {
            grid-column: 1 / -1;
            height: 46px;
            border-radius: 12px;
            border: none;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #6366f1, #4338ca);
        }

        #roleForm button:hover {
            filter: brightness(1.1);
        }
        .form-title {
            grid-column: 1 / -1;
            /* span full width */
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 10px;
        }
        @media (max-width: 768px) {
            #roleForm {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header id="header">
        <h1>Placement Tracker</h1>
        <input type="search" id="search" placeholder="Search roles...">
        <nav id="navlinks">
            <a href="../index.html">Home</a>
            <a href="./students.html">Students</a>
            <a href="./colleges.html">Colleges</a>
            <a href="./companies.html">Companies</a>
            <a href="./roles.html">Job Roles</a>
        </nav>
    </header>
    <form id = "roleForm">
        <h1 class="form-title">Add New Job Role</h1>
        <input type = "text" placeholder="Enter role id" id = "roleId">
        <input type = "text" placeholder="Enter title" id = "title">
        <button type="submit">Submit</button>
    </form>
    <script src="../JS/addRole.js"></script>
</body>
</html>
